server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: lax

spring:
  mongodb:
    uri: ${DB_URL}
    database: ${DB_NAME:readersDB}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
