server:
  port: ${PORT:8080}

spring:
  mongodb:
    uri: ${DB_URL}
    database: ${DB_NAME:readersDB}

readers-club:
  password-hash: ${ADMIN_PASSWORD_HASH}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
